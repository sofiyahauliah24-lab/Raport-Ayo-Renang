<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk - AYO RENANG</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container auth-container">
    <div class="logo-display">
      <h2>AYO <span>RENANG</span></h2>
      <p>Sistem Catatan Perkembangan & Evaluasi Peserta</p>
    </div>

    <div class="card">
      <h2 style="color: var(--primary-color); font-weight: 700; margin-bottom: 20px; text-align: center;">Masuk Aplikasi</h2>

      <!-- Alert Message Box -->
      <div id="alert-box" class="alert" style="display: none;"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" required placeholder="nama@email.com">
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" required placeholder="••••••••">
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;" id="btn-login-submit">
          Masuk
        </button>

        <div style="margin-top: 20px; text-align: center; font-size: 0.85rem; color: #666;">
          <p>🔑 Portal khusus Pelatih & Administrator.</p>
          <p style="margin-top: 4px; font-size: 0.8rem; color: #888;">Pendaftaran akun staff baru dikelola oleh Administrator dari dalam sistem.</p>
        </div>
      </form>
    </div>
  </div>

  <!-- Supabase CDN, Client, Auth Helpers, and Page Logic -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
