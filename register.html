<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar - AYO RENANG</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container auth-container">
    <div class="logo-display">
      <h2>AYO <span>RENANG</span></h2>
      <p>Sistem Catatan Perkembangan & Evaluasi Peserta</p>
    </div>

    <div class="card">
      <h2 style="color: var(--primary-color); font-weight: 700; margin-bottom: 20px; text-align: center;">Daftar Akun Orang Tua</h2>

      <!-- Alert Message Box -->
      <div id="alert-box" class="alert" style="display: none;"></div>

      <form id="register-form">
        <div class="form-group">
          <label for="reg-name">Nama Lengkap</label>
          <input type="text" id="reg-name" required placeholder="Contoh: Andi Wijaya">
        </div>
        <div class="form-group">
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" required placeholder="nama@email.com">
        </div>
        <div class="form-group">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" required placeholder="Min. 6 karakter">
        </div>
        <div class="form-group">
          <label for="reg-confirm-password">Konfirmasi Password</label>
          <input type="password" id="reg-confirm-password" required placeholder="Ulangi password">
        </div>
        
        <div class="form-group">
          <label for="reg-role">Daftar Sebagai</label>
          <select id="reg-role" required>
            <option value="coach">Pelatih (Coach)</option>
            <option value="admin">Administrator (Admin)</option>
          </select>
        </div>

        <button type="submit" class="btn btn-accent" style="width: 100%; margin-top: 10px;" id="btn-register-submit">
          Daftar Akun
        </button>

        <div style="margin-top: 20px; text-align: center; font-size: 0.9rem;">
          <p>Sudah memiliki akun? <a href="login.html" style="color: var(--secondary-color); font-weight: 600; text-decoration: none;">Masuk di sini</a></p>
        </div>
      </form>
    </div>
  </div>

  <!-- Supabase CDN, Client, Auth Helpers, and Page Logic -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
